<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BrainBurst – General Knowledge Quiz</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- ===== SCREEN 1: WELCOME ===== -->
  <div id="screen-welcome" class="screen active">
    <div class="bg-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="welcome-card">
      <div class="logo-wrap">
        <span class="logo-icon">🧠</span>
        <h1 class="logo-text">BrainBurst</h1>
      </div>
      <p class="tagline">Think fast. Score big. Have fun!</p>
      <div class="welcome-stats">
        <div class="stat"><span class="stat-num">20</span><span class="stat-label">Questions</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><span class="stat-num">30s</span><span class="stat-label">Per Q</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><span class="stat-num">5</span><span class="stat-label">Topics</span></div>
      </div>
      <input type="text" id="player-name" class="name-input" placeholder="Enter your name…" maxlength="20"/>
      <button class="btn btn-primary" id="start-btn" onclick="startQuiz()">
        Let's Play! 🚀
      </button>
      <p class="hint-text">Choose a difficulty below</p>
      <div class="difficulty-row">
        <button class="diff-btn active" data-diff="easy" onclick="setDifficulty(this)">😊 Easy</button>
        <button class="diff-btn" data-diff="medium" onclick="setDifficulty(this)">🔥 Medium</button>
        <button class="diff-btn" data-diff="hard" onclick="setDifficulty(this)">💀 Hard</button>
      </div>
    </div>
  </div>

  <!-- ===== SCREEN 2: QUIZ ===== -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <div class="quiz-meta">
        <span class="q-counter" id="q-counter">Q 1 / 20</span>
        <span class="player-badge" id="player-badge">Player</span>
      </div>
      <div class="score-pill">⭐ <span id="live-score">0</span></div>
    </div>

    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar"></div>
    </div>
    <div class="timer-label" id="timer-label">30</div>

    <div class="question-card" id="question-card">
      <div class="category-tag" id="category-tag">🌍 Geography</div>
      <p class="question-text" id="question-text">Loading question…</p>
    </div>

    <div class="options-grid" id="options-grid">
      <!-- Options injected by JS -->
    </div>

    <div class="quiz-footer">
      <div class="progress-dots" id="progress-dots"></div>
    </div>
  </div>

  <!-- ===== SCREEN 3: RESULT ===== -->
  <div id="screen-result" class="screen">
    <div class="bg-blobs result-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <h2 class="result-title" id="result-title">Amazing!</h2>
      <p class="result-sub" id="result-sub">You crushed it!</p>
      <div class="score-circle">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="50"/>
          <circle class="fill" id="score-arc" cx="60" cy="60" r="50"/>
        </svg>
        <div class="score-inner">
          <span class="score-big" id="score-final">0</span>
          <span class="score-max">/ <span id="score-max-val">20</span></span>
        </div>
      </div>
      <div class="result-stats-row">
        <div class="rstat"><span id="r-correct">0</span><small>Correct</small></div>
        <div class="rstat"><span id="r-wrong">0</span><small>Wrong</small></div>
        <div class="rstat"><span id="r-skipped">0</span><small>Skipped</small></div>
        <div class="rstat"><span id="r-time">0s</span><small>Avg Time</small></div>
      </div>
      <div class="result-btns">
        <button class="btn btn-primary" onclick="restartQuiz()">🔄 Play Again</button>
        <button class="btn btn-secondary" onclick="reviewAnswers()">📋 Review</button>
      </div>
    </div>
  </div>

  <!-- ===== SCREEN 4: REVIEW ===== -->
  <div id="screen-review" class="screen">
    <div class="review-header">
      <button class="back-btn" onclick="goToResult()">← Back</button>
      <h2>Answer Review</h2>
    </div>
    <div class="review-list" id="review-list"></div>
  </div>

  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
